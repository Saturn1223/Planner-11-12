<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#202633;--muted:#687386;--line:#e5e8ee;

  --red:#b85a5a;--shadow:0 3px 14px rgba(25,35,55,.055);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;line-height:1.55}
header{background:#26364e;color:white;padding:28px 20px 24px}
.wrap{max-width:1050px;margin:0 auto;padding:0 16px}
h1{font-size:25px;margin:0 0 7px}
header p{margin:0;color:#d8e0ec;font-size:14px}
main{padding:20px 0 48px}
.summary,.toolbar,.phase,.day{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.summary{padding:17px;margin-bottom:14px}
.progress-head{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}
.progress-track{height:9px;background:#e9edf2;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.progress-fill{height:100%;width:0;background:var(--green);transition:width .2s}
.small{font-size:12px;color:var(--muted)}
.toolbar{padding:12px 14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
button,select{font:inherit;border:1px solid var(--line);background:white;color:var(--text);padding:7px 11px;border-radius:8px;cursor:pointer}
button:hover{background:var(--accent-soft)}
select{margin-left:auto}
.phase{padding:17px;margin:22px 0 12px}
.phase h2{font-size:18px;margin:0 0 4px}
.phase p{font-size:13px;color:var(--muted);margin:0}
.days{display:grid;grid-template-columns:1fr;gap:10px}
.day{overflow:hidden}
.day summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:12px;align-items:center}
.day summary::-webkit-details-marker{display:none}
.date{font-weight:700;min-width:118px}
.daytitle{flex:1;font-size:14px}
.daymeta{font-size:12px;color:var(--muted);white-space:nowrap}
.day.done-day{border-color:#b7d9ce}
.day.done-day summary{background:#f2faf7}
.tasks{padding:0 16px 14px 145px}
.task{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:14px}
.task input{margin-top:4px;accent-color:var(--green);width:16px;height:16px;flex:0 0 auto}
.task input:checked+span{text-decoration:line-through;color:#89919e}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:5px}
.tag.urgent{background:#fff0ef;color:var(--red)}
.tag.research{background:#eef7f4;color:var(--green)}
.note{font-size:12px;color:var(--muted);padding:0 16px 13px 145px}
@media(max-width:650px){
 header{padding:22px 16px}h1{font-size:21px}
 .day summary{flex-wrap:wrap;gap:5px 10px}
 .date{min-width:100px}.daytitle{flex-basis:calc(100% - 115px)}
 .daymeta{margin-left:110px}
 .tasks,.note{padding-left:16px}
 select{margin-left:0}
}
@media print{
 body{background:white}.toolbar{display:none}.summary,.phase,.day{box-shadow:none;break-inside:avoid}
 .day details{break-inside:avoid}.day summary{padding:8px}.tasks{padding-bottom:8px}
}
</style>
</head>

<header><div class="wrap">

const planner=document.getElementById('planner');
let total=0;
phases.forEach((phase,pi)=>{
  const section=document.createElement('section');
  section.innerHTML=`<div class="phase"><h2>${phase.title}</h2><p>${phase.subtitle}</p></div>`;
  const days=document.createElement('div');days.className='days';
  phase.days.forEach((d,di)=>{
    const id=`${pi}-${di}`;
    const detail=document.createElement('details');detail.className='day';detail.dataset.day=id;
    const summary=document.createElement('summary');
    summary.innerHTML=`<span class="date">${d[0].slice(5).replace('-','/')}（${d[1].replace('星期','周')}）</span><span class="daytitle">${d[2]}</span><span class="daymeta"><span class="daycount">0/${d[3].length}</span> 完成</span>`;
    const taskBox=document.createElement('div');taskBox.className='tasks';
    d[3].forEach((task,ti)=>{
      total++;
      const key=`novdec26-${id}-${ti}`;
      const label=document.createElement('label');label.className='task';
      label.innerHTML=`<input type="checkbox" data-key="${key}"><span></span>`;
      label.querySelector('span').textContent=task;
      taskBox.appendChild(label);
    });
    detail.append(summary,taskBox);days.appendChild(detail);
  });
  section.appendChild(days);planner.appendChild(section);
});

const boxes=[...document.querySelectorAll('input[type=checkbox]')];
function refresh(){
  let checked=0;
  document.querySelectorAll('.day').forEach(day=>{
    const inputs=[...day.querySelectorAll('input')];
    const n=inputs.filter(x=>x.checked).length;
    checked+=n;
    day.querySelector('.daycount').textContent=`${n}/${inputs.length}`;
    day.classList.toggle('done-day',n===inputs.length);
  });
  document.getElementById('progressText').textContent=`${checked} / ${total} 项`;
  const pct=Math.round(checked/total*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressPercent').textContent=`${pct}% 已完成`;
}
boxes.forEach(box=>{
  const saved=localStorage.getItem(box.dataset.key);
  box.checked=saved==='1';
  box.addEventListener('change',()=>{
    localStorage.setItem(box.dataset.key,box.checked?'1':'0');refresh();applyFilter();
  });
});
function applyFilter(){
  const f=document.getElementById('filter').value;
  document.querySelectorAll('.day').forEach(day=>{
    const inputs=[...day.querySelectorAll('input')];
    const complete=inputs.every(x=>x.checked);
    day.style.display=(f==='all'||(f==='complete'&&complete)||(f==='incomplete'&&!complete))?'':'none';
  });
}
document.getElementById('filter').addEventListener('change',applyFilter);
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.day').forEach(d=>d.open=true);
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.day').forEach(d=>d.open=false);
document.getElementById('clearChecks').onclick=()=>{
  if(confirm('确定清空所有已勾选任务吗？此操作无法撤销。')){
    boxes.forEach(b=>{b.checked=false;localStorage.removeItem(b.dataset.key)});
    refresh();applyFilter();
  }
};
refresh();
